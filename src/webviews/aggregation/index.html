<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; font-src {{cspSource}};" />
  <title>{{title}}</title>
</head>
<body class="mc-aggregation-page">
  <div id="app" class="mc-aggregation-app">
    <div class="mc-toolbar">
      <span class="mc-namespace" id="namespace">—</span>
      <button class="mc-btn primary" id="btn-run" title="Run pipeline (Cmd/Ctrl+Enter)">▶ Run</button>
      <button class="mc-btn" id="btn-cancel">■ Cancel</button>
      <button class="mc-btn" id="btn-explain">Explain</button>
      <button class="mc-btn" id="btn-count">Count</button>
      <span class="spacer"></span>
      <button class="mc-btn" id="btn-save">★ Save</button>
      <button class="mc-btn" id="btn-view">Create View</button>
      <button class="mc-btn" id="btn-export">Export</button>
    </div>
    <div class="mc-status" id="status"><span id="status-text">Ready</span></div>
    <main class="mc-pipeline-workspace">
      <section class="mc-pipeline-editor-pane">
        <div class="mc-pane-title">
          <span>Pipeline</span>
          <div class="mc-segment" role="tablist" aria-label="Pipeline editor mode">
            <button class="mc-btn active" id="btn-mode-text" title="Edit the pipeline as text">Text</button>
            <button class="mc-btn" id="btn-mode-builder" title="Build the pipeline stage by stage">Builder</button>
          </div>
        </div>
        <div id="pipeline-editor" class="mc-pipeline-editor"></div>
        <div id="pipeline-builder" class="mc-pipeline-builder" hidden></div>
      </section>
      <div
        id="pipeline-resizer"
        class="mc-pipeline-resizer"
        role="separator"
        aria-label="Resize pipeline editor and results"
        aria-orientation="vertical"
        tabindex="0"
      ></div>
      <section class="mc-pipeline-output-pane">
        <div class="mc-pane-title">
          <span>Pipeline output preview</span>
          <div class="mc-result-view-controls">
            <span id="results-info" class="mc-muted">—</span>
            <button class="mc-btn" id="btn-result-list" title="List view" aria-label="List view">☰</button>
            <button class="mc-btn mc-table-view-toggle" id="btn-result-table" title="Table view" aria-label="Table view">▦</button>
            <button class="mc-btn" id="btn-result-json" title="JSON view" aria-label="JSON view">{ }</button>
          </div>
        </div>
        <div id="results" class="mc-pipeline-results"></div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
  <script nonce="{{nonce}}" src="./index.js"></script>
</body>
</html>
